<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShelfScan Lite</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#153D32">
<style>
:root{--g:#153D32;--bg:#F5F1E8;--au:#D8A84E;--card:#fff;--tx:#1d2b26;--mut:#65716b;--bad:#b3261e;--ok:#1f7a4d;--bd:#e1dccd}
@media(prefers-color-scheme:dark){:root{--bg:#101a16;--card:#1a2722;--tx:#eef1ee;--mut:#9aa8a1;--bad:#ff8a80;--ok:#7ad6a3;--bd:#2b3b35;--g:#1f5744}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font:700 19px Georgia,serif;letter-spacing:.2px}
.chip{background:rgba(255,255,255,.15);border-radius:99px;padding:3px 10px;font-size:13px}
main{padding:12px;max-width:960px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 10px}
.card.bad{border-color:var(--bad)}.card.ok{border-color:var(--ok)}
h3{margin:0 0 8px;font:700 18px Georgia,serif}
label{display:block;font-size:14px;color:var(--mut);margin:6px 0}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx);margin-top:3px}
button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:600 16px system-ui;margin:6px 0 0;cursor:pointer}
button.b2{background:transparent;color:var(--g);border:1.5px solid var(--g)}
@media(prefers-color-scheme:dark){button.b2{color:#fff;border-color:#fff}}
.row{display:flex;gap:8px}.row input{flex:1}.row button{margin-top:3px}
.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav{overflow-x:auto}nav button{flex:0 0 auto;background:none;color:var(--mut);border-radius:0;margin:0;padding:14px 14px;font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}.st{margin:0;cursor:pointer;text-align:center}.st b{display:block;font:700 28px Georgia,serif;color:var(--g)}.st span{color:var(--mut);font-size:13px}
.bar{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:6px 0;padding:5px 9px;border-radius:8px;background:linear-gradient(90deg,rgba(216,168,78,.6) var(--w),var(--bd) 0)}[data-sh]{cursor:pointer}
.pill{font-style:normal;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}.pill.available,.pill.returned{background:#cfe9da;color:#14532d}.pill.loaned,.pill.active{background:#fde9bf;color:#6b4a00}.pill.lost,.pill.damaged,.pill.overdue,.pill.conflict{background:#f6cfca;color:#8a1c14}
.cp{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px}.cp select{width:auto}ul{margin:4px 0;padding-left:18px}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--au);font-weight:700}
@media(prefers-color-scheme:dark){nav button.on{color:#fff}}
#cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
#cam[hidden]{display:none}#vid{flex:1;width:100%;object-fit:cover}
#cam button{margin:12px;background:var(--au);color:#000}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;z-index:30;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.lb{border:1px dashed #999;padding:4px;text-align:center;break-inside:avoid;color:#000}.lb svg{max-width:100%}}
</style></head><body>
<header><b>ShelfScan</b><span id="chip" class="chip">Offline</span></header>
<main id="M"></main>
<nav><button data-v="home">Dashboard</button><button data-v="cat">Books</button><button data-v="shelves">Shelves</button><button data-v="out">Check-out</button><button data-v="in">Check-in</button><button data-v="loans">Loans</button><button data-v="mem">Members</button><button data-v="sync">Sync</button></nav>
<div id="cam" hidden><video id="vid" playsinline muted></video><button onclick="stop()">Close camera</button></div>
<div id="toast"></div><div id="pr"></div>
<script>
/* >>> PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES <<< */
const BACKEND_URL='https://script.google.com/macros/s/AKfycbxeBK1vdMR3vnTRNWMlhC9Z5E-PBKdSnGebrQmlYiuxACndIdXAgctPHzUlf_UAr7g/exec';
const $=s=>document.querySelector(s),M=$('#M'),V={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3200)};
const lib=(u,g)=>window[g]?0:new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=()=>j(new Error('This needs internet once'));document.head.appendChild(s)});
const ZX='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',JB='https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js';

/* ---------- IndexedDB (local-first store) ---------- */
let db;const ST=['books','copies','shelves','members','loans','ops','meta'];
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('shelfscan',2);q.onupgradeneeded=()=>ST.forEach(s=>{if(!q.result.objectStoreNames.contains(s))q.result.createObjectStore(s,{keyPath:s=='meta'?'k':s=='ops'?'op_id':'id'})});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>j(q.error)});
const tx=(s,m,f)=>new Promise((r,j)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>j(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const mget=async k=>(await get('meta',k))?.v,mset=(k,v)=>put('meta',{k,v});
/* Save records and queue sync operations in ONE transaction, so nothing is half-saved. */
async function saveAll(items){const t=db.transaction([...new Set(items.map(i=>i[0])),'ops'],'readwrite');const at=new Date().toISOString();
 for(const[e,r]of items){r.updated_at=at;r.row_status=r.row_status||'active';t.objectStore(e).put(r);t.objectStore('ops').put({op_id:crypto.randomUUID(),entity:e,record:{...r},at})}
 await new Promise((a,b)=>{t.oncomplete=a;t.onerror=()=>b(t.error)});pend();sync(true)}
const nextCode=async()=>{const n=(await mget('cnt')||0)+1;await mset('cnt',n);return'C'+await mget('dev')+String(n).padStart(5,'0')};
const norm=s=>{s=String(s||'').replace(/[^0-9Xx]/g,'').toUpperCase();if(s.length==10){const b='978'+s.slice(0,9);let t=0;for(let i=0;i<12;i++)t+=b[i]*(i%2?3:1);return b+(10-t%10)%10}return s};

/* ---------- Camera scanning (BarcodeDetector, ZXing fallback) ---------- */
let stream,tm,zx;
async function scan(cb,cont){const v=$('#vid');$('#cam').hidden=false;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){$('#cam').hidden=true;return toast('Camera blocked. Allow camera access or type the code.')}
 v.srcObject=stream;await v.play();let last='',lt=0;
 const hit=c=>{const n=Date.now();if(c==last&&n-lt<2500)return;last=c;lt=n;navigator.vibrate?.(60);if(!cont)stop();cb(c)};
 if('BarcodeDetector'in window){const d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128','qr_code']});
  const loop=async()=>{if(!stream)return;try{const r=await d.detect(v);if(r[0])hit(r[0].rawValue)}catch{}tm=setTimeout(loop,120)};loop()}
 else{try{await lib(ZX,'ZXing');zx=new ZXing.BrowserMultiFormatReader();zx.decodeFromVideoElement(v,r=>{if(r)hit(r.getText())})}catch(e){stop();toast(e.message)}}}
function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;clearTimeout(tm);try{zx?.reset()}catch{}$('#cam').hidden=true}
async function labels(it){try{await lib(JB,'JsBarcode')}catch(e){return toast(e.message)}
 $('#pr').innerHTML=it.map((x,i)=>`<div class="lb"><small>${esc(x.t)}</small><svg id="b${i}"></svg></div>`).join('');
 it.forEach((x,i)=>JsBarcode('#b'+i,x.c,{format:'CODE128',height:36,fontSize:11,margin:2}));setTimeout(print,250)}

/* ---------- Catalog ---------- */
V.cat=async()=>{M.innerHTML=`<div class="card"><h3>Add a book</h3><div class="row"><input id="isbn" inputmode="numeric" placeholder="ISBN"><button id="sc">Scan</button></div><button id="go">Look up ISBN</button> <button id="mn" class="b2">No ISBN</button><div id="form"></div></div><input id="q" placeholder="Search title, author or ISBN" style="margin-bottom:10px"><div id="list"></div>`;
 $('#sc').onclick=()=>scan(c=>{$('#isbn').value=c;lookup(c)});$('#go').onclick=()=>lookup($('#isbn').value);
 $('#mn').onclick=()=>form({isbn:''},false);$('#isbn').onkeydown=e=>e.key=='Enter'&&lookup(e.target.value);$('#q').oninput=list;list();
 if(window.editb){get('books',window.editb).then(b=>b&&form(b,true));window.editb=null}
 $('#list').onclick=async e=>{const id=e.target.dataset.e||e.target.dataset.a;if(!id)return;const b=await get('books',id);
  if(e.target.dataset.e){form(b,true);return scrollTo(0,0)}
  const cs=(await all('copies')).filter(c=>c.book_id==id&&c.row_status!='archived'),ls=await all('loans');
  if(cs.some(c=>ls.some(l=>l.copy_id==c.id&&l.status=='active')))return toast('Some copies are on loan. Return them first.');
  if(!confirm(`Archive this book and its ${cs.length} copies?`))return;
  b.row_status='archived';cs.forEach(c=>{c.row_status='archived';c.status='archived'});await saveAll([['books',b],...cs.map(c=>['copies',c])]);toast('Book archived');list()}};
async function list(){const q=($('#q').value||'').toLowerCase(),[bs,cs]=await Promise.all([all('books'),all('copies')]);
 $('#list').innerHTML=bs.filter(b=>b.row_status!='archived'&&(b.title+b.author+b.isbn).toLowerCase().includes(q)).sort((a,b)=>a.title>b.title?1:-1).slice(0,100).map(b=>{
  const k=cs.filter(c=>c.book_id==b.id&&c.row_status!='archived');
  return`<div class="card"><b>${esc(b.title)}</b><div class="mut">${esc(b.author)} ${b.isbn?'· '+esc(b.isbn):''}</div><div>${k.filter(c=>c.status=='available').length} of ${k.length} available <button class="b2" data-l="${b.id}">Print labels</button> <button class="b2" data-e="${b.id}">Edit</button> <button class="b2" data-a="${b.id}">Archive</button></div></div>`}).join('')||'<p class="mut">No books yet. Scan an ISBN to add your first book.</p>';
 document.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{const b=bs.find(y=>y.id==x.dataset.l);labels(cs.filter(c=>c.book_id==b.id).map(c=>({c:c.barcode,t:b.title.slice(0,28)})))})}
async function meta(isbn){
 try{const v=(await(await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn)).json()).items?.[0]?.volumeInfo;if(v)return{title:v.title,author:(v.authors||[]).join(', '),publisher:v.publisher||'',year:(v.publishedDate||'').slice(0,4),cover:v.imageLinks?.thumbnail||''}}catch{}
 try{const v=(await(await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)).json())['ISBN:'+isbn];if(v)return{title:v.title,author:(v.authors||[]).map(a=>a.name).join(', '),publisher:(v.publishers||[])[0]?.name||'',year:(v.publish_date||'').slice(-4),cover:v.cover?.medium||''}}catch{}return{}}
async function lookup(raw){const isbn=norm(raw);if(!isbn)return toast('Enter or scan an ISBN');
 const ex=(await all('books')).find(b=>b.isbn==isbn&&b.row_status!='archived');let d=ex||{isbn};
 if(!ex){if(navigator.onLine){toast('Looking up…');d={...d,...await meta(isbn)}}else toast('Offline: enter details by hand')}
 form(d,!!ex)}
async function form(d,ex){const sh=(await all('shelves')).filter(x=>x.row_status!='archived'),cats=[...new Set((await all('books')).map(b=>b.category).filter(Boolean))];$('#form').innerHTML=`${ex?'<p class="ok">Already in your catalog. Add more copies below.</p>':''}<label>Title<input id="t" value="${esc(d.title)}"></label><label>Author<input id="a" value="${esc(d.author)}"></label><label>Publisher<input id="p" value="${esc(d.publisher)}"></label><label>Year<input id="y" value="${esc(d.year)}"></label><label>Category or genre<input id="cg" list="cl" value="${esc(d.category)}"><datalist id="cl">${cats.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label><label>Shelf for new copies<select id="sh"><option value="">No shelf yet</option>${sh.map(x=>`<option value="${x.id}" ${x.id==window.pre?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Copies to add<input id="n" type="number" min="${ex?0:1}" value="1"></label><button id="sv">Save book</button>`;
 $('#sv').onclick=async()=>{const n=+$('#n').value||0,t=$('#t').value.trim();if(!t)return toast('Title is required');
  const sid=$('#sh').value,sv=sh.find(x=>x.id==sid);if(sv&&n&&+sv.capacity){const used=(await all('copies')).filter(c=>c.location==sid&&c.row_status!='archived').length;if(used+n>+sv.capacity)return toast(`${sv.name} has room for ${Math.max(0,sv.capacity-used)} more copies`)}
  const b=ex?{...d}:{id:crypto.randomUUID(),isbn:d.isbn,cover:d.cover||'',created_at:new Date().toISOString()};Object.assign(b,{title:t,author:$('#a').value,publisher:$('#p').value,year:$('#y').value,category:$('#cg').value.trim()});
  const items=[['books',b]],made=[];for(let i=0;i<n;i++){const c={id:crypto.randomUUID(),book_id:b.id,barcode:await nextCode(),location:sid,status:'available',condition:'good'};items.push(['copies',c]);made.push({c:c.barcode,t:t.slice(0,28)})}
  await saveAll(items);toast(`Saved ${t}`);$('#form').innerHTML=made.length?`<p>New copy barcodes: ${made.map(m=>m.c).join(', ')}</p><button id="pl">Print labels</button>`:'';if(made.length)$('#pl').onclick=()=>labels(made);list()}}

/* ---------- Circulation ---------- */
const cfg=async()=>({ld:+(await mget('ld'))||14,mx:+(await mget('mx'))||3});
V.out=async()=>{let mb=null,n=0;const{ld,mx}=await cfg();
 M.innerHTML=`<div class="card"><h3>Check-out</h3><div id="who" class="mut">Step 1: find the member.</div><label>Member card, or admission / staff number if they have no card<div class="row"><input id="mno" placeholder="Scan card or type number"><button id="msc">Scan</button><button id="mgo">Find</button></div></label><div id="pick"></div><label>Book barcode<div class="row"><input id="code" placeholder="Scan or type book barcode"><button id="sc">Scan</button></div></label><button id="nx" class="b2">Next member</button></div><div id="log"></div>`;
 const log=(m,c)=>$('#log').insertAdjacentHTML('afterbegin',`<div class="card ${c}">${m}</div>`);
 const who=()=>$('#who').innerHTML=mb?`<b>${esc(mb.full_name)}</b> · ${esc(mb.type)} ${esc(mb.member_no)} · ${n} of ${mx} books out`:'Step 1: find the member.';
 const setM=async m=>{if(m.status=='inactive')return log(`${esc(m.full_name)} is inactive`,'bad');mb=m;n=(await all('loans')).filter(l=>l.member_id==m.id&&l.status=='active').length;$('#pick').innerHTML='';who();$('#code').focus()};
 const findM=async raw=>{const q=String(raw).trim().toLowerCase();if(!q)return;const ms=(await all('members')).filter(m=>m.row_status!='archived');
  const ex=ms.find(m=>String(m.member_no).toLowerCase()==q||String(m.barcode||'').toLowerCase()==q);if(ex)return setM(ex);
  const nm=ms.filter(m=>m.full_name.toLowerCase().includes(q)).slice(0,5);if(nm.length==1)return setM(nm[0]);
  if(nm.length){$('#pick').innerHTML=nm.map(m=>`<button class="b2" data-i="${m.id}">${esc(m.full_name)} · ${esc(m.member_no)}</button> `).join('');$('#pick').querySelectorAll('button').forEach(x=>x.onclick=()=>setM(nm.find(m=>m.id==x.dataset.i)));return}
  log(`No member found for "${esc(raw)}". Check the number or register them under Members.`,'bad')};
 const handle=async raw=>{const code=String(raw).trim();if(!code)return;if(!mb)return log('Find the member first','bad');
  const[cs,ls,bs]=await Promise.all([all('copies'),all('loans'),all('books')]);
  const c=cs.find(x=>x.barcode==code&&x.row_status!='archived');if(!c){const q=code.toLowerCase(),r=bs.filter(b=>(b.title+b.isbn+b.author).toLowerCase().includes(q)).slice(0,5);
  if(!r.length)return log(`Nothing found for ${esc(code)}`,'bad');
  $('#pick').innerHTML=r.map(b=>{const x=cs.find(y=>y.book_id==b.id&&y.status=='available'&&y.row_status!='archived');return x?`<button class="b2" data-b="${esc(x.barcode)}">${esc(b.title)} (${cs.filter(y=>y.book_id==b.id&&y.status=='available').length} free)</button> `:`<div class="bad">${esc(b.title)}: no copy available</div>`}).join('');
  $('#pick').querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{$('#pick').innerHTML='';handle(x.dataset.b)});return}
  const b=bs.find(x=>x.id==c.book_id);if(c.status!='available')return log(`${esc(b?.title)} is not available (${c.status})`,'bad');
  if(n>=mx)return log(`${esc(mb.full_name)} has reached the limit of ${mx} books`,'bad');
  const due=new Date(Date.now()+ld*864e5).toISOString(),loan={id:crypto.randomUUID(),copy_id:c.id,book_id:c.book_id,member_id:mb.id,checkout_at:new Date().toISOString(),due_at:due,returned_at:'',renewals:'0',status:'active',device:await mget('dev')};
  c.status='loaned';await saveAll([['loans',loan],['copies',c]]);n++;who();log(`Issued <b>${esc(b?.title)}</b>. Due ${due.slice(0,10)}`,'ok')};
 $('#mno').onkeydown=e=>e.key=='Enter'&&findM(e.target.value);$('#mgo').onclick=()=>findM($('#mno').value);$('#msc').onclick=()=>scan(c=>{$('#mno').value=c;findM(c)});
 $('#code').onkeydown=e=>{if(e.key=='Enter'){handle(e.target.value);e.target.value=''}};$('#sc').onclick=()=>scan(handle,true);
 $('#nx').onclick=()=>{mb=null;n=0;who();$('#pick').innerHTML='';$('#mno').value='';$('#mno').focus()};$('#mno').focus()};
V.in=async()=>{M.innerHTML=`<div class="card"><h3>Check-in</h3><label>Condition on return<select id="dm"><option value="good">Good<option value="damaged">Damaged<option value="lost">Lost</select></label><div class="row"><input id="code" placeholder="Scan or type the book barcode"><button id="sc">Scan</button></div></div><div id="log"></div>`;
 const log=(m,c)=>$('#log').insertAdjacentHTML('afterbegin',`<div class="card ${c}">${m}</div>`);
 const handle=async raw=>{const code=String(raw).trim();if(!code)return;const[cs,ls,bs,ms]=await Promise.all([all('copies'),all('loans'),all('books'),all('members')]);
  const c=cs.find(x=>x.barcode==code);if(!c)return log(`Unknown code ${esc(code)}`,'bad');const b=bs.find(x=>x.id==c.book_id);
  const l=ls.find(x=>x.copy_id==c.id&&x.status=='active');if(!l)return log(`${esc(b?.title)} is not on loan`,'bad');
  const m=ms.find(x=>x.id==l.member_id),late=Math.floor((Date.now()-new Date(l.due_at))/864e5);
  await doReturn(l,c,$('#dm').value);log(`Returned <b>${esc(b?.title)}</b> from ${esc(m?.full_name)}${late>0?` <span class="bad">· ${late} day${late>1?'s':''} overdue</span>`:''}`,late>0?'bad':'ok')};
 $('#code').onkeydown=e=>{if(e.key=='Enter'){handle(e.target.value);e.target.value=''}};$('#sc').onclick=()=>scan(handle,true)};

/* ---------- Members and teachers ---------- */
V.mem=async()=>{M.innerHTML=`<div class="card"><h3>Add a member or teacher</h3><label>Full name<input id="nm"></label><label>Type<select id="ty"><option>student<option>teacher<option>staff<option>community</select></label><label>Admission or staff number<input id="no"></label><label>Class or department<input id="cl"></label><label>Phone<input id="ph" type="tel"></label><button id="ad">Save member</button></div><input id="q" placeholder="Search members" style="margin-bottom:8px"><button class="b2" id="pc">Print all cards</button><div id="ml"></div>`;
 const ml=async()=>{const q=$('#q').value.toLowerCase(),ms=(await all('members')).filter(m=>m.row_status!='archived'&&(m.full_name+m.member_no).toLowerCase().includes(q)).sort((a,b)=>a.full_name>b.full_name?1:-1);
  $('#ml').innerHTML=ms.slice(0,150).map(m=>`<div class="card"><b>${esc(m.full_name)}</b><div class="mut">${esc(m.type)} · ${esc(m.member_no)} · ${esc(m.class_or_dept)}</div></div>`).join('')||'<p class="mut">No members yet.</p>';$('#pc').onclick=()=>labels(ms.map(m=>({c:m.member_no,t:m.full_name})))};
 $('#q').oninput=ml;ml();
 $('#ad').onclick=async()=>{const nm=$('#nm').value.trim(),no=$('#no').value.trim();if(!nm||!no)return toast('Name and number are required');
  if((await all('members')).some(m=>m.member_no==no&&m.row_status!='archived'))return toast('That number is already registered');
  await saveAll([['members',{id:crypto.randomUUID(),member_no:no,full_name:nm,type:$('#ty').value,class_or_dept:$('#cl').value,phone:$('#ph').value,email:'',status:'active'}]]);
  toast('Member saved');['nm','no','cl','ph'].forEach(i=>$('#'+i).value='');ml()}};

/* ---------- Sync with the Google Sheet ---------- */
async function pend(){const n=(await all('ops')).length;$('#chip').textContent=(navigator.onLine?'Online':'Offline')+(n?` · ${n} to sync`:' · synced')}
let busy=0;
async function sync(quiet){const url=BACKEND_URL;if(busy||!navigator.onLine||!url||url.startsWith('PASTE'))return;busy=1;$('#chip').textContent='Syncing…';
 try{const ops=(await all('ops')).slice(0,100);
  const r=await fetch(url,{method:'POST',body:JSON.stringify({pin:await mget('pin'),device:await mget('dev'),since:await mget('since')||'',ops})}),j=await r.json();
  if(!j.ok)throw new Error(j.error);
  for(const o of ops)await del('ops',o.op_id);
  for(const e of['books','copies','shelves','members','loans'])for(const rec of j.changes[e]||[]){const l=await get(e,rec.id);if(!l||l.updated_at<=rec.updated_at)await put(e,rec)}
  await mset('since',j.now);await mset('last',new Date().toLocaleString());
  const bad=Object.values(j.results).filter(x=>x!='ok'&&x!='duplicate'&&x!='stale').length;if(bad)toast(`Server rejected or flagged ${bad} change(s): ${[...new Set(Object.values(j.results).filter(x=>!['ok','duplicate','stale'].includes(x)))].join(', ')}`);
  busy=0;if((await all('ops')).length)return sync(quiet)}
 catch(e){if(!quiet)toast('Sync failed: '+e.message)}finally{busy=0;pend()}}
V.sync=async()=>{const v=async k=>esc(await mget(k)??'');
 M.innerHTML=`<div class="card"><h3>Sync</h3><div id="st" class="mut"></div><button id="sn">Sync now</button></div><div class="card"><h3>Settings</h3><label>PIN<input id="pn" type="password" value="${await v('pin')}"></label><label>Loan period (days)<input id="ld" type="number" value="${(await cfg()).ld}"></label><label>Max books per member<input id="mx" type="number" value="${(await cfg()).mx}"></label><label>Fine per overdue day (0 = no fines)<input id="fr" type="number" min="0" value="${+(await mget('fr'))||0}"></label><button id="ss">Save settings</button></div>`;
 const st=async()=>{const lc=(await all('loans')).filter(l=>l.status=='conflict').length;$('#st').innerHTML=`${BACKEND_URL.startsWith('PASTE')?'<span class="bad">Backend URL is not set in index.html.</span><br>':''}${(await all('ops')).length} waiting to sync · last sync: ${esc(await mget('last')||'never')}${lc?`<br><span class="bad">${lc} loan conflict(s): the same book was issued on two devices. Fix in the Loans tab of the Sheet.</span>`:''}`};st();
 $('#sn').onclick=async()=>{await sync();st()};
 $('#ss').onclick=async()=>{await mset('pin',$('#pn').value.trim());await mset('ld',$('#ld').value);await mset('mx',$('#mx').value);await mset('fr',$('#fr').value||0);toast('Settings saved');sync()}};

/* ---------- Shared helpers ---------- */
const D=x=>String(x||'').slice(0,10);
const bar=(l,v,t,a='')=>`<div class="bar" ${a} style="--w:${t?Math.min(100,Math.round(v/t*100)):0}%"><span>${esc(l)}</span><b>${v}</b></div>`;
const csv=(n,rows)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download=n+'.csv';a.click()};
const data=async()=>{const[b,c,s,l,m]=await Promise.all(['books','copies','shelves','loans','members'].map(all)),lv=a=>a.filter(x=>x.row_status!='archived');return{b:lv(b),c:lv(c),s:lv(s),l,m:lv(m)}};
async function doReturn(l,c,cond){if(l.status!='active')return toast('That loan is already closed');
 const now=new Date(),late=Math.max(0,Math.floor((now-new Date(l.due_at))/864e5)),fr=+(await mget('fr'))||0;
 l.returned_at=now.toISOString();l.status=cond=='lost'?'lost':'returned';l.return_condition=cond;l.fine=String(late*fr);
 c.status=cond=='lost'?'lost':cond=='damaged'?'damaged':'available';if(cond=='damaged')c.condition='damaged';
 await saveAll([['loans',l],['copies',c]])}

/* ---------- Dashboard (all figures computed from local records) ---------- */
V.home=async()=>{const{b,c,s,l}=await data(),now=Date.now(),fr=+(await mget('fr'))||0,act=l.filter(x=>x.status=='active'),od=act.filter(x=>new Date(x.due_at)<now),cnt=k=>c.filter(x=>x.status==k).length,T=c.length;
 const cats={},top={};b.forEach(x=>{const k=x.category||'Uncategorised';cats[k]=(cats[k]||0)+c.filter(y=>y.book_id==x.id).length});l.forEach(x=>top[x.book_id]=(top[x.book_id]||0)+1);
 const ti=id=>esc(b.find(x=>x.id==id)?.title||'(archived)'),rec=(a,k)=>[...a].sort((p,q)=>String(q[k]||'')>String(p[k]||'')?1:-1).slice(0,5),lst=a=>a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="mut">Nothing yet.</p>';
 const sh=s.map(x=>[x,c.filter(y=>y.location==x.id).length]),free=sh.reduce((a,[x,n])=>a+(+x.capacity?Math.max(0,x.capacity-n):0),0),late=od.map(x=>Math.floor((now-new Date(x.due_at))/864e5)),sum=late.reduce((a,v)=>a+v,0);
 const card=(n,v,go)=>`<div class="card st" ${go?`data-go="${go}"`:''}><b>${v}</b><span>${n}</span></div>`;
 M.innerHTML=`<div class="g">${card('Titles',b.length)}${card('Physical copies',T)}${card('Available',cnt('available'))}${card('On loan',cnt('loaned'),'loans')}${card('Overdue',od.length,'loans')}${card('Lost or damaged',cnt('lost')+cnt('damaged'),'loans')}${card('Shelves',s.length,'shelves')}${card('Categories',Object.keys(cats).length)}</div>
 <div class="row"><button data-go="out">Check-out</button><button class="b2" data-go="in">Check-in</button><button class="b2" data-go="cat">Add book</button><button class="b2" data-go="shelves">Shelves</button><button class="b2" id="ex">Export CSV</button></div>
 <div class="card"><h3>Availability</h3>${[['Available',cnt('available')],['On loan',cnt('loaned')],['Damaged',cnt('damaged')],['Lost',cnt('lost')]].map(([a,v])=>bar(a,v,T)).join('')}</div>
 <div class="card"><h3>Shelf occupancy</h3>${sh.map(([x,n])=>bar(`${x.name} (${n}/${x.capacity||'no limit'})`,n,+x.capacity||n||1,`data-sh="${x.id}"`)).join('')||'<p class="mut">No shelves yet.</p>'}<div class="mut">Free shelf capacity: ${free} · Copies not on a shelf: ${c.filter(x=>!x.location).length}</div></div>
 <div class="card"><h3>By category</h3>${Object.entries(cats).sort((p,q)=>q[1]-p[1]).slice(0,8).map(([k,v])=>bar(k,v,T)).join('')||'<p class="mut">Add a category to your books.</p>'}</div>
 <div class="card"><h3>Overdue</h3>${od.length} loans · average ${od.length?(sum/od.length).toFixed(1):0} days late${fr?` · fines accruing: ${sum*fr}`:''}</div>
 <div class="card"><h3>Most borrowed</h3>${lst(Object.entries(top).sort((p,q)=>q[1]-p[1]).slice(0,5).map(([id,n])=>`${ti(id)} · ${n}`))}</div>
 <div class="card"><h3>Recently added</h3>${lst(rec(b,'created_at').map(x=>esc(x.title)))}</div>
 <div class="card"><h3>Recently returned</h3>${lst(rec(l.filter(x=>x.returned_at),'returned_at').map(x=>`${ti(x.book_id)} · ${D(x.returned_at)}`))}</div>`;
 $('#ex').onclick=()=>csv('inventory',[['Barcode','Title','ISBN','Category','Shelf','Condition','Status'],...c.map(x=>{const k=b.find(y=>y.id==x.book_id)||{};return[x.barcode,k.title,k.isbn,k.category,s.find(y=>y.id==x.location)?.name,x.condition,x.status]})])};

/* ---------- Shelf management ---------- */
V.shelves=async()=>{const sid=window.opensh;window.opensh=null;if(sid)return shelfView(sid);const{c,s}=await data();
 M.innerHTML=`<div class="card"><h3>Shelves</h3><button id="ns">Add shelf</button></div><input id="q" placeholder="Search shelves" style="margin-bottom:10px"><div id="sl"></div>`;
 const draw=()=>{const q=$('#q').value.toLowerCase();$('#sl').innerHTML=s.filter(x=>(x.name+x.section+x.floor+x.category).toLowerCase().includes(q)).map(x=>{const n=c.filter(y=>y.location==x.id).length,cap=+x.capacity||0;return`<div class="card"><b>${esc(x.name)}</b> <span class="mut">${esc(x.section)} ${esc(x.floor)} ${esc(x.category)}</span>${bar(`Books ${n}${cap?' of '+cap:''}`,n,cap||n||1)}<button data-o="${x.id}">Open</button> <button class="b2" data-ed="${x.id}">Edit</button> <button class="b2" data-d="${x.id}">Delete</button></div>`}).join('')||'<p class="mut">No shelves yet. Add one to start organising books.</p>'};
 draw();$('#q').oninput=draw;$('#ns').onclick=()=>shelfForm();
 $('#sl').onclick=e=>{const d=e.target.dataset,f=i=>s.find(x=>x.id==i);if(d.o)shelfView(d.o);if(d.ed)shelfForm(f(d.ed));if(d.d)delShelf(f(d.d))}};
function shelfForm(x={}){const e=!!x.id;M.innerHTML=`<div class="card"><h3>${e?'Edit':'Add'} shelf</h3><label>Name or number<input id="n" value="${esc(x.name)}"></label><label>Section or location<input id="se" value="${esc(x.section)}"></label><label>Floor or room<input id="fl" value="${esc(x.floor)}"></label><label>Shelf category<input id="ct" value="${esc(x.category)}"></label><label>Description<input id="ds" value="${esc(x.description)}"></label><label>Maximum books (copies)<input id="cp" type="number" min="1" value="${esc(x.capacity)}"></label><button id="sv">Save shelf</button> <button class="b2" id="cx">Cancel</button></div>`;
 $('#cx').onclick=()=>show('shelves');
 $('#sv').onclick=async()=>{const n=$('#n').value.trim(),cap=+$('#cp').value;if(!n)return toast('Shelf name is required');if(!(cap>0))return toast('Enter a capacity of at least 1');
  const{c,s}=await data();if(s.some(y=>y.id!=x.id&&y.name.toLowerCase()==n.toLowerCase()))return toast('A shelf with that name already exists');
  const used=c.filter(y=>y.location==x.id).length;if(e&&cap<used)return toast(`${used} copies are on this shelf. Capacity cannot be lower.`);
  const r=e?{...x}:{id:crypto.randomUUID(),created_at:new Date().toISOString()};Object.assign(r,{name:n,section:$('#se').value,floor:$('#fl').value,category:$('#ct').value,description:$('#ds').value,capacity:String(cap)});
  await saveAll([['shelves',r]]);toast('Shelf saved');show('shelves')}}
async function delShelf(x){const n=(await data()).c.filter(c=>c.location==x.id).length;if(n)return toast(`${x.name} holds ${n} copies. Move them to another shelf first.`);
 if(!confirm(`Delete shelf ${x.name}?`))return;x.row_status='archived';await saveAll([['shelves',x]]);toast('Shelf deleted');show('shelves')}
async function shelfView(id){const{b,c,s}=await data(),x=s.find(y=>y.id==id);if(!x)return show('shelves');
 const mine=c.filter(y=>y.location==id),cap=+x.capacity||0,others=s.filter(y=>y.id!=id),bks=[...new Set(mine.map(y=>y.book_id))].map(i=>b.find(z=>z.id==i)).filter(Boolean);
 M.innerHTML=`<div class="card"><h3>${esc(x.name)}</h3><div class="mut">${esc(x.section)} ${esc(x.floor)} ${esc(x.category)}<br>${esc(x.description)}</div>${bar(`Occupancy ${mine.length}${cap?' of '+cap:''}`,mine.length,cap||mine.length||1)}<div class="mut">Free: ${cap?cap-mine.length:'no limit'} · Created ${D(x.created_at)} · Updated ${D(x.updated_at)}</div><button id="ab">Add books here</button> <button class="b2" id="bk">Back</button></div>`+
 (bks.map(k=>{const cs=mine.filter(y=>y.book_id==k.id);return`<div class="card"><div class="row" style="align-items:flex-start">${k.cover?`<img src="${esc(k.cover)}" alt="" width="48" style="border-radius:6px">`:''}<div><b>${esc(k.title)}</b><div class="mut">${esc(k.author)} · ${esc(k.isbn)} · ${esc(k.category)}</div><div>${cs.length} copies · ${cs.filter(y=>y.status=='available').length} available · ${cs.filter(y=>y.status=='loaned').length} borrowed</div></div></div>${cs.map(y=>`<div class="cp"><span>${esc(y.barcode)} <i class="pill ${y.status}">${y.status}</i></span><select data-cond="${y.id}">${['good','fair','damaged'].map(o=>`<option ${o==y.condition?'selected':''}>${o}</option>`).join('')}</select><select data-mv="${y.id}"><option value="">Move to…</option>${others.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div>`).join('')}<button class="b2" data-e="${k.id}">Edit book</button></div>`}).join('')||'<p class="mut">No books on this shelf yet.</p>');
 $('#bk').onclick=()=>show('shelves');$('#ab').onclick=()=>{window.pre=id;show('cat')};
 M.onchange=async e=>{const d=e.target.dataset;if(!d.cond&&!d.mv)return;const cp=await get('copies',d.cond||d.mv);if(!cp)return;
  if(d.cond){cp.condition=e.target.value;await saveAll([['copies',cp]]);return toast('Condition updated')}
  if(!e.target.value)return;const t=s.find(y=>y.id==e.target.value),used=c.filter(y=>y.location==t.id).length;
  if(+t.capacity&&used>=+t.capacity){e.target.value='';return toast(`${t.name} is full`)}
  if(!confirm(`Move ${cp.barcode} to ${t.name}?`)){e.target.value='';return}cp.location=t.id;await saveAll([['copies',cp]]);toast('Copy moved');shelfView(id)}}

/* ---------- Borrowed books and returns ---------- */
V.loans=async()=>{const[b,c,s,l,m]=await Promise.all(['books','copies','shelves','loans','members'].map(all)),fr=+(await mget('fr'))||0;let pg=1;
 const T={active:'Currently borrowed',overdue:'Overdue',returned:'Returned',lost:'Lost',damaged:'Damaged',all:'All loans'};
 M.innerHTML=`<div class="card"><h3>Borrowed books and returns</h3><div class="row"><select id="f">${Object.entries(T).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="b2" id="ex">Export CSV</button></div><input id="q" placeholder="Borrower, title, ISBN or copy barcode"><div class="row"><input id="fa" type="date" aria-label="From"><input id="fz" type="date" aria-label="To"></div></div><div id="lr"></div>`;
 const rows=()=>{const q=$('#q').value.toLowerCase(),a=$('#fa').value,z=$('#fz').value,f=$('#f').value,now=Date.now();
  return l.map(x=>{const cp=c.find(y=>y.id==x.copy_id)||{},bk=b.find(y=>y.id==x.book_id)||{},mb=m.find(y=>y.id==x.member_id)||{},od=x.status=='active'&&new Date(x.due_at)<now;return{x,cp,bk,mb,od,late:od?Math.floor((now-new Date(x.due_at))/864e5):0,sh:s.find(y=>y.id==cp.location)}})
  .filter(r=>({active:r.x.status=='active',overdue:r.od,returned:r.x.status=='returned',lost:r.x.status=='lost',damaged:r.x.return_condition=='damaged',all:1})[f]&&(!q||(r.bk.title+r.bk.isbn+r.cp.barcode+r.mb.full_name+r.mb.member_no).toLowerCase().includes(q))&&(!a||D(r.x.checkout_at)>=a)&&(!z||D(r.x.checkout_at)<=z))
  .sort((p,q)=>q.x.checkout_at>p.x.checkout_at?1:-1)};
 const draw=()=>{const R=rows(),now=Date.now();$('#lr').innerHTML=(R.slice(0,pg*25).map(r=>{const x=r.x,st=r.od?'overdue':x.status;return`<div class="card ${r.od?'bad':''}"><div class="row" style="align-items:flex-start">${r.bk.cover?`<img src="${esc(r.bk.cover)}" alt="" width="44" style="border-radius:6px">`:''}<div><b>${esc(r.bk.title)}</b> <i class="pill ${st}">${st}</i><div class="mut">Copy ${esc(r.cp.barcode)} · Shelf ${esc(r.sh?.name||'none')}</div><div>${esc(r.mb.full_name)} (${esc(r.mb.member_no)})</div><div class="mut">Out ${D(x.checkout_at)} · Due ${D(x.due_at)}${x.returned_at?' · Returned '+D(x.returned_at):''}</div><div>${x.status=='active'?(r.od?`<span class="bad">${r.late} days overdue${fr?' · fine '+r.late*fr:''}</span>`:`${Math.ceil((new Date(x.due_at)-now)/864e5)} days left`):(+x.fine?`Fine ${x.fine}`:'')}</div></div></div>${x.status=='active'?`<div class="cp"><select data-rc="${x.id}"><option value="good">Good<option value="damaged">Damaged<option value="lost">Lost</select><button data-r="${x.id}">Return</button><button class="b2" data-h="${esc(r.mb.member_no)}">Borrower history</button></div>`:`<button class="b2" data-h="${esc(r.mb.member_no)}">Borrower history</button>`}</div>`}).join('')+(R.length>pg*25?'<button class="b2" id="mo">Show more</button>':''))||'<p class="mut">No loans match these filters.</p>'};
 ['f','q','fa','fz'].forEach(i=>$('#'+i).oninput=()=>{pg=1;draw()});draw();
 $('#ex').onclick=()=>csv('loans',[['Title','Copy','Borrower','Member no','Out','Due','Returned','Status','Fine'],...rows().map(r=>[r.bk.title,r.cp.barcode,r.mb.full_name,r.mb.member_no,D(r.x.checkout_at),D(r.x.due_at),D(r.x.returned_at),r.od?'overdue':r.x.status,r.x.fine||''])]);
 $('#lr').onclick=async e=>{const d=e.target.dataset;if(e.target.id=='mo'){pg++;return draw()}
  if(d.r){const lo=l.find(y=>y.id==d.r);await doReturn(lo,c.find(y=>y.id==lo.copy_id),$(`[data-rc="${d.r}"]`).value);toast('Return recorded');draw()}
  if(d.h){$('#q').value=d.h;$('#f').value='all';pg=1;draw()}}};

/* ---------- Start ---------- */
async function show(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));stop();await V[v]()}
(async()=>{await open();if(!await mget('dev'))await mset('dev',Math.random().toString(36).slice(2,5).toUpperCase());
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
 M.onclick=e=>{const t=e.target,g=t.closest('[data-go]'),h=t.closest('[data-sh]');if(g)show(g.dataset.go);else if(h){window.opensh=h.dataset.sh;show('shelves')}else if(t.dataset.e&&!$('#list')){window.editb=t.dataset.e;show('cat')}};
 addEventListener('online',()=>{pend();sync(true)});addEventListener('offline',pend);setInterval(()=>sync(true),120000);
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
 if(navigator.onLine){lib(ZX,'ZXing').catch(()=>0);lib(JB,'JsBarcode').catch(()=>0)}
 await pend();show(await mget('pin')?'home':'sync');sync(true)})();
</script></body></html>
